name: Build Windows application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: Simple-Video-Redactor-unsigned
          path: dist/Simple Video Redactor.exe
          retention-days: 14
